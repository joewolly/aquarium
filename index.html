<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kitty Aquarium 3D</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#021018;font-family:system-ui,sans-serif}
  #ui{position:fixed;top:10px;left:10px;background:rgba(0,0,0,.55);color:#fff;padding:10px 12px;border-radius:10px;font-size:14px;transition:opacity .5s;z-index:2}
  #ui.hide{opacity:0;pointer-events:none}
  #ui label{display:block;margin:6px 0}
  #ui button{margin:3px 3px 0 0;padding:4px 8px;border-radius:6px;border:0;cursor:pointer}
  #ui a{color:#9df}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="ui">
  <b>🐟 Kitty Aquarium 3D</b> <small>(H hides menu)</small>
  <label>Scene <select id="env"></select></label>
  <label>Fish <select id="species"><option value="mix">Mixed</option></select></label>
  <label>Count <input id="count" type="range" min="1" max="50" value="16"></label>
  <label>Speed <input id="speed" type="range" min="0.3" max="3" step="0.1" value="1"></label>
  <label><input id="auto" type="checkbox" checked> Auto-change scene every 5 min</label>
  <button id="food">Feed</button><button id="fs">Fullscreen</button> <a href="classic.html">2D version</a>
</div>
<script type="module">
import * as THREE from 'three';
const R=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,200);
camera.position.set(0,4,22);camera.lookAt(0,3,0);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

const ENVS={
  'Tropical Reef':{water:0x1a7fa0,sand:0xd9c48f,sun:0xfff4d6,sunI:3,plants:[0xe84393,0xfd9644,0xa55eea,0x26de81],kelp:false},
  'Kelp Forest':{water:0x1d5f58,sand:0x8a7a55,sun:0xe6ffd0,sunI:2.4,plants:[0x7a8b2d,0x9aa84a,0x5c6e1e],kelp:true},
  'Freshwater Pond':{water:0x3d5e2a,sand:0x5d4a2e,sun:0xfff0b0,sunI:2.2,plants:[0x2ecc71,0x27ae60],kelp:false},
  'Deep Ocean':{water:0x061a33,sand:0x1b1f2f,sun:0x6688ff,sunI:.8,plants:[0x1e3799,0x3c6382],kelp:false,glow:true},
};
const SPECIES={
  Clownfish:{base:'#ff6a00',stripes:['#ffffff',3,'v'],len:1.1,h:.45,w:.3},
  'Blue Tang':{base:'#1552e0',stripes:['#0a0a20',1,'tang'],tail:'#ffd000',len:1.6,h:.75,w:.22},
  Goldfish:{base:'#ff9a1a',len:1.4,h:.6,w:.4,longTail:true},
  'Neon Tetra':{base:'#9aa7b8',stripes:['#1ff0ff',1,'neon'],len:.6,h:.2,w:.12,school:true},
  Angelfish:{base:'#e8e4d8',stripes:['#222',4,'v'],len:1.3,h:1.1,w:.12,tall:true},
  Betta:{base:'#b01030',len:1.1,h:.4,w:.25,longTail:true},
  'Yellow Tang':{base:'#ffd60a',len:1.4,h:.95,w:.18},
  Shark:{base:'#6f7c86',len:5,h:.9,w:.8,shark:true},
};
const envSel=document.getElementById('env'),spSel=document.getElementById('species');
Object.keys(ENVS).forEach(k=>envSel.add(new Option(k,k)));Object.keys(SPECIES).forEach(k=>spSel.add(new Option(k,k)));
let speed=1;

// --- lights
const hemi=new THREE.HemisphereLight(0x9fd8ff,0x223322,.7);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(5,30,8);sun.castShadow=true;
Object.assign(sun.shadow.camera,{left:-30,right:30,top:30,bottom:-30});sun.shadow.mapSize.set(2048,2048);scene.add(sun);

// --- caustics shader chunk, shared uniform
const U={uTime:{value:0}};
const causticGLSL=`
float cN(vec2 p){vec2 i=floor(p),f=fract(p);float m=1.;for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){vec2 g=vec2(x,y);
 vec2 o=fract(sin(vec2(dot(i+g,vec2(127.1,311.7)),dot(i+g,vec2(269.5,183.3))))*43758.5);o=.5+.5*sin(uTime*.8+6.28*o);m=min(m,length(g+o-f));}return m;}
float caustic(vec2 p){return pow(1.-cN(p*.9),6.)*1.4+pow(1.-cN(p*1.7+3.),6.)*.8;}`;
function addCaustics(){return;
}function _unused(mat,strength=1){mat.onBeforeCompile=s=>{s.uniforms.uTime=U.uTime;
  s.vertexShader='varying vec3 vW;\n'+s.vertexShader.replace('#include <worldpos_vertex>','#include <worldpos_vertex>\nvW=(modelMatrix*vec4(transformed,1.)).xyz;');
  s.fragmentShader='uniform float uTime;varying vec3 vW;\n'+causticGLSL+s.fragmentShader.replace('#include <dithering_fragment>',
   `#include <dithering_fragment>\n float up=clamp(normalize(cross(dFdx(vW),dFdy(vW))).y,0.,1.);gl_FragColor.rgb+=caustic(vW.xz)*up*${strength.toFixed(2)}*vec3(.9,1.,.95)*uCaus;`)
   .replace('uniform float uTime;','uniform float uTime;uniform float uCaus;');s.uniforms.uCaus=causU;};}
const causU={value:1};

// --- sand
const sandGeo=new THREE.PlaneGeometry(120,80,160,100);sandGeo.rotateX(-Math.PI/2);
{const p=sandGeo.attributes.position;for(let i=0;i<p.count;i++){const X=p.getX(i),Z=p.getZ(i);
  p.setY(i,Math.sin(X*.3)*.25+Math.cos(Z*.4+X*.1)*.3+Math.sin(X*2.1+Z*1.7)*.04+(Z<-15?(-Z-15)*.15:0));}sandGeo.computeVertexNormals();}
const sandTex=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,256,256);
  for(let i=0;i<9000;i++){const v=180+Math.random()*75|0;g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(Math.random()*256,Math.random()*256,1.5,1.5)}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(30,20);t.colorSpace=THREE.SRGBColorSpace;return t})();
const sandMat=new THREE.MeshStandardMaterial({map:sandTex,roughness:1});addCaustics(sandMat,1.2);
const sand=new THREE.Mesh(sandGeo,sandMat);sand.receiveShadow=true;scene.add(sand);
const causMesh=new THREE.Mesh(sandGeo,new THREE.ShaderMaterial({uniforms:{uTime:U.uTime,uCaus:causU},transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  polygonOffset:true,polygonOffsetFactor:-2,
  vertexShader:'varying vec3 vW;void main(){vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}',
  fragmentShader:'uniform float uTime;uniform float uCaus;varying vec3 vW;'+causticGLSL+'void main(){float d=length(vW.xz)/60.;gl_FragColor=vec4(vec3(.9,1.,.85)*caustic(vW.xz)*.35*uCaus*(1.-clamp(d,0.,1.)),1.);}'}));
scene.add(causMesh);

// --- decor group rebuilt per env
let decor=new THREE.Group();scene.add(decor);const plants=[];
function rock(){const g=new THREE.SphereGeometry(R(.8,2.5),32,20),p=g.attributes.position;
  for(let i=0;i<p.count;i++){const v=new THREE.Vector3().fromBufferAttribute(p,i);const n=1+.25*Math.sin(v.x*2.3+v.z*1.1)*Math.cos(v.y*1.9)+R(-.04,.04);v.multiplyScalar(n);v.y*=.6;p.setXYZ(i,v.x,v.y,v.z)}
  g.computeVertexNormals();const m=new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(.08,.08,R(.25,.45)),roughness:.95,flatShading:false});addCaustics(m,.8);
  const r=new THREE.Mesh(g,m);r.castShadow=r.receiveShadow=true;return r;}
function plant(color,height){const segs=16,g=new THREE.PlaneGeometry(.35,height,1,segs);g.translate(0,height/2,0);
  const m=new THREE.MeshStandardMaterial({color,side:THREE.DoubleSide,roughness:.7,transparent:true,opacity:.95});
  m.onBeforeCompile=s=>{s.uniforms.uTime=U.uTime;s.uniforms.uPh={value:R(0,6)};m.userData.s=s;
    s.vertexShader='uniform float uTime;uniform float uPh;\n'+s.vertexShader.replace('#include <begin_vertex>',
    `vec3 transformed=position;float k=position.y/${height.toFixed(2)};transformed.x+=sin(uTime*.9+uPh+position.y*.6)*k*k*${(height*.12).toFixed(2)};transformed.z+=cos(uTime*.7+uPh)*k*k*${(height*.08).toFixed(2)};transformed.x*=1.-k*.6;`)};
  const mesh=new THREE.Mesh(g,m);mesh.castShadow=true;return mesh;}
function buildEnv(name){const e=ENVS[name];scene.remove(decor);decor=new THREE.Group();scene.add(decor);
  const wc=new THREE.Color(e.water);scene.background=wc;scene.fog=new THREE.FogExp2(wc,e.glow?.04:.018);
  sun.color.set(e.sun);sun.intensity=e.sunI;hemi.color.set(e.water).lerp(new THREE.Color(0xffffff),.5);causU.value=e.glow?.15:1;
  sandMat.color.set(e.sand);
  for(let i=0;i<14;i++){const r=rock();r.position.set(R(-25,25),0,R(-20,6));r.rotation.y=R(0,6);decor.add(r)}
  const n=e.kelp?70:120;for(let i=0;i<n;i++){const cx=R(-28,28),cz=R(-22,5);
    for(let j=0;j<(e.kelp?1:5);j++){const p=plant(pick(e.plants),e.kelp?R(8,16):R(.8,3.5));p.position.set(cx+R(-.6,.6),0,cz+R(-.6,.6));p.rotation.y=R(0,6);decor.add(p)}}
  // god rays
  const rayMat=new THREE.MeshBasicMaterial({color:0xfff8e0,transparent:true,opacity:.04,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,fog:false});
  for(let i=0;i<10;i++){const r=new THREE.Mesh(new THREE.ConeGeometry(R(2,5),40,16,1,true),rayMat);r.position.set(R(-20,20),14,R(-15,2));r.rotation.z=.25;r.userData.ray=R(0,6);decor.add(r)}
}

// --- fish
function fishTexture(sp){const c=document.createElement('canvas');c.width=512;c.height=256;const g=c.getContext('2d');
  // u: tail(0)->head(1), v: belly(0)..back(1)
  const gr=g.createLinearGradient(0,0,0,256);const b=new THREE.Color(sp.base);
  gr.addColorStop(0,'#'+b.clone().multiplyScalar(.45).getHexString());gr.addColorStop(.45,sp.base);gr.addColorStop(1,'#'+b.clone().lerp(new THREE.Color(1,1,1),.55).getHexString());
  g.fillStyle=gr;g.fillRect(0,0,512,256);
  if(sp.stripes){const [col,n,kind]=sp.stripes;g.fillStyle=col;
    if(kind==='v')for(let i=0;i<n;i++){const x=512*(.25+i*.6/n)+ (kind==='v'?0:0);g.fillRect(x,0,512/(n*5),256)}
    if(kind==='neon'){g.fillRect(0,70,470,40);g.fillStyle='#ff2040';g.fillRect(0,110,260,110)}
    if(kind==='tang'){g.beginPath();g.moveTo(80,60);g.quadraticCurveTo(250,20,380,90);g.quadraticCurveTo(250,60,110,150);g.fill()}}
  // scales
  g.strokeStyle='rgba(255,255,255,.12)';g.lineWidth=1;for(let y=0;y<256;y+=10)for(let x=(y/10%2)*7;x<512;x+=14){g.beginPath();g.arc(x,y,7,-1.3,1.3);g.stroke()}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;}
const texCache={};
function fishMaterial(sp,glow){const m=new THREE.MeshPhysicalMaterial({map:texCache[sp.name]||(texCache[sp.name]=fishTexture(sp)),roughness:.35,clearcoat:.8,clearcoatRoughness:.3,sheen:.5,sheenColor:new THREE.Color(0xaaddff),
  emissive:glow?new THREE.Color(sp.base):0x000000,emissiveIntensity:glow?.4:0});
  m.onBeforeCompile=s=>{s.uniforms.uTime=U.uTime;s.uniforms.uPh=m.userData.ph;s.uniforms.uAmp=m.userData.amp;s.uniforms.uLen={value:sp.len};
    s.vertexShader='uniform float uTime;uniform float uPh;uniform float uAmp;uniform float uLen;\n'+s.vertexShader.replace('#include <begin_vertex>',
    `vec3 transformed=position;float k=clamp(.5-position.x/uLen,0.,1.2);transformed.z+=sin(uPh-position.x*4./uLen)*k*k*uAmp*uLen*.35;`)};
  return m;}
function makeFishMesh(sp,glow){const L=sp.len,H=sp.h,Wd=sp.w;
  const body=new THREE.SphereGeometry(1,48,24),p=body.attributes.position,uv=body.attributes.uv;
  for(let i=0;i<p.count;i++){let x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    // sphere axis along y -> fish axis along x
    const ax=y; const t=(ax+1)/2; // 0 tail..1 head
    const prof=Math.pow(Math.sin(Math.PI*Math.pow(t,.85)),.8)*(t<.12?.6+t*3.3:1);
    let px=ax*L/2, py=x*H/2*prof, pz=z*Wd/2*prof;
    if(sp.shark){py*=1-.3*(1-t);}
    p.setXYZ(i,px,py,pz);uv.setXY(i,t,(x+1)/2);}
  body.computeVertexNormals();
  const mat=fishMaterial(sp,glow);const g=new THREE.Group();const bm=new THREE.Mesh(body,mat);bm.castShadow=true;g.add(bm);
  // fins as shapes, sharing swim shader via separate translucent material
  const finMat=new THREE.MeshPhysicalMaterial({color:sp.tail||sp.base,transparent:true,opacity:sp.longTail?.6:.85,side:THREE.DoubleSide,roughness:.4,transmission:.3,emissive:glow?new THREE.Color(sp.base):0,emissiveIntensity:glow?.3:0});
  finMat.userData=mat.userData;finMat.onBeforeCompile=mat.onBeforeCompile;
  const shape=(pts)=>{const s=new THREE.Shape();s.moveTo(...pts[0]);for(let i=1;i<pts.length;i+=2)s.quadraticCurveTo(...pts[i],...pts[i+1]);return new THREE.ShapeGeometry(s,12)};
  const tl=sp.longTail?L*.9:L*.35, th=sp.longTail?H*1.4:H*.8, x0=-L*.45;
  g.add(new THREE.Mesh(shape([[x0+.05,0],[x0-tl*.4,th*.3],[x0-tl,th],[x0-tl*.6,0],[x0-tl,-th],[x0-tl*.4,-th*.3],[x0+.05,0]]),finMat));
  const dh=sp.shark?H*1.4:sp.tall?H*1.3:H*.6;
  g.add(new THREE.Mesh(shape([[-L*.3,H*.35],[-L*.1,H*.35+dh],[L*.1,H*.42]]),finMat));
  g.add(new THREE.Mesh(shape([[-L*.32,-H*.35],[-L*.2,-H*.35-dh*.7],[-L*.02,-H*.4]]),finMat));
  // eyes
  const eyeM=new THREE.MeshPhysicalMaterial({color:0x050505,roughness:0,clearcoat:1}),ringM=new THREE.MeshStandardMaterial({color:0xd8cc90});
  for(const s of [1,-1]){const ring=new THREE.Mesh(new THREE.SphereGeometry(H*.13,16,12),ringM);ring.position.set(L*.33,H*.1,s*Wd*.3);g.add(ring);
    const e=new THREE.Mesh(new THREE.SphereGeometry(H*.09,16,12),eyeM);e.position.set(L*.33+.01,H*.1,s*(Wd*.3+H*.06));g.add(e)}
  return {g,mat};}

const fish=[];const food=[];
function spawnFish(name){const k=name&&name!=='mix'?name:pick(Object.keys(SPECIES));const sp={...SPECIES[k],name:k};
  const s=R(1.2,1.9);const {g,mat}=(()=>{const o={ph:{value:R(0,6)},amp:{value:.3}};const m=makeFishMesh(sp,ENVS[envSel.value].glow);m.mat.userData.ph=o.ph;m.mat.userData.amp=o.amp;return m})();
  g.scale.setScalar(s);const f={g,sp,ph:mat.userData.ph,amp:mat.userData.amp,vel:new THREE.Vector3(R(-1,1),R(-.1,.1),R(-.5,.5)).setLength(R(1.2,2.2)*(sp.shark?.7:1)),target:new THREE.Vector3(),tt:0,freq:R(5,8)};
  g.position.set(R(-18,18),R(1,10),R(-14,6));newTarget(f);scene.add(g);return f;}
function newTarget(f){f.target.set(R(-16,16),R(1.2,9),R(-10,10));f.tt=R(4,12)}
function setCount(){const n=+document.getElementById('count').value,sp=spSel.value;
  for(let i=fish.length-1;i>=0;i--)if(sp!=='mix'&&fish[i].sp.name!==sp){scene.remove(fish[i].g);fish.splice(i,1)}
  while(fish.length<n)fish.push(spawnFish(sp));while(fish.length>n)scene.remove(fish.pop().g);}
function rebuildFish(){fish.forEach(f=>scene.remove(f.g));fish.length=0;setCount()}

// particulates
const motes=new THREE.Points(new THREE.BufferGeometry().setAttribute('position',new THREE.Float32BufferAttribute(Array.from({length:3000},(_,i)=>i%3===1?R(0,18):R(-30,30)),3)),
  new THREE.PointsMaterial({color:0xffffff,size:.05,transparent:true,opacity:.5,depthWrite:false}));scene.add(motes);
// bubbles
const bubGeo=new THREE.SphereGeometry(.08,10,8),bubMat=new THREE.MeshPhysicalMaterial({color:0xffffff,transmission:1,roughness:0,thickness:.1,transparent:true,opacity:.5});
const bubbles=[];for(let i=0;i<60;i++){const b=new THREE.Mesh(bubGeo,bubMat);b.position.set(8+R(-.3,.3),R(0,18),-6+R(-.3,.3));b.scale.setScalar(R(.5,1.6));scene.add(b);bubbles.push(b)}

const foodGeo=new THREE.SphereGeometry(.07,6,4),foodMat=new THREE.MeshStandardMaterial({color:0xa0602a});
function feed(x){for(let i=0;i<15;i++){const m=new THREE.Mesh(foodGeo,foodMat);m.position.set(x+R(-2,2),16,R(-4,4));scene.add(m);food.push(m)}}
const ray=new THREE.Raycaster();
renderer.domElement.addEventListener('click',e=>{ray.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),camera);
  const p=ray.ray.at((0-ray.ray.origin.z)/ray.ray.direction.z,new THREE.Vector3());feed(p.x)});

const clock=new THREE.Clock(),tmp=new THREE.Vector3(),q=new THREE.Quaternion(),m4=new THREE.Matrix4();
function tick(){const dt=Math.min(clock.getDelta(),.05)*speed,t=clock.elapsedTime;U.uTime.value=t;
  decor.children.forEach(o=>{if(o.userData.ray!==undefined){o.material.opacity=.025+.015*Math.sin(t*.5+o.userData.ray)}});
  for(const f of fish){const P=f.g.position;f.tt-=dt;
    let tgt=f.target;let near=null,nd=12;for(const fd of food){const d=fd.position.distanceTo(P);if(d<nd){nd=d;near=fd}}
    if(near){tgt=near.position;if(nd<.5*f.g.scale.x+.3){scene.remove(near);food.splice(food.indexOf(near),1)}}
    else if(f.tt<0||P.distanceTo(tgt)<1.5)newTarget(f);
    const maxS=(f.sp.shark?1.6:near?4:2.4);
    tmp.subVectors(tgt,P).setLength(maxS);f.vel.lerp(tmp,dt*(near?1.5:.5));
    if(f.sp.school){for(const o of fish)if(o!==f&&o.sp.name===f.sp.name&&o.g.position.distanceTo(P)<4)f.vel.lerp(o.vel,dt*.3)}
    f.vel.y*=.98;P.addScaledVector(f.vel,dt);P.y=Math.max(.8,Math.min(13,P.y));
    const sp=f.vel.length();f.ph.value+=dt*f.freq*(.5+sp*.6);f.amp.value=THREE.MathUtils.lerp(f.amp.value,.15+Math.min(sp,4)*.1,dt*2);
    m4.lookAt(new THREE.Vector3(),f.vel,new THREE.Vector3(0,1,0));q.setFromRotationMatrix(m4).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),Math.PI/2));
    f.g.quaternion.slerp(q,dt*3);}
  for(const fd of food){if(fd.position.y>.2)fd.position.y-=dt*.8;fd.position.x+=Math.sin(t*2+fd.id)*.003}
  for(const b of bubbles){b.position.y+=dt*(1.5+b.scale.x);b.position.x+=Math.sin(t*3+b.id)*.004;if(b.position.y>18)b.position.y=0}
  const mp=motes.geometry.attributes.position;for(let i=1;i<mp.array.length;i+=3){mp.array[i]+=dt*.05;if(mp.array[i]>18)mp.array[i]=0}mp.needsUpdate=true;
  camera.position.x=Math.sin(t*.05)*3;camera.position.y=4+Math.sin(t*.07)*.5;camera.lookAt(0,2.5,0);
  renderer.render(scene,camera);requestAnimationFrame(tick);}

function setEnv(n){envSel.value=n;buildEnv(n);rebuildFish()}
envSel.onchange=()=>setEnv(envSel.value);spSel.onchange=rebuildFish;
document.getElementById('count').oninput=setCount;document.getElementById('speed').oninput=e=>speed=+e.target.value;
document.getElementById('food').onclick=()=>feed(R(-12,12));
document.getElementById('fs').onclick=()=>document.documentElement.requestFullscreen?.();
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='h')document.getElementById('ui').classList.toggle('hide')});
setInterval(()=>{if(document.getElementById('auto').checked)setEnv(pick(Object.keys(ENVS)))},300000);
setEnv(envSel.value);tick();
</script>
</body>
</html>
