<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Kitty Aquarium</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100vw;height:100vh}
  #menuBtn{position:fixed;top:8px;right:10px;color:#fff;font-size:22px;opacity:.25;cursor:pointer;z-index:3;padding:4px 8px}
  #ui{position:fixed;top:10px;left:10px;max-height:calc(100vh - 40px);overflow:auto;background:rgba(0,10,20,.85);color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;transition:opacity .4s;z-index:2;width:270px}
  #ui.hide{opacity:0;pointer-events:none}
  #ui h3{margin:0 0 6px;font-size:16px}
  #ui label{display:flex;justify-content:space-between;align-items:center;margin:6px 0;gap:8px}
  #ui select,#ui input[type=range]{max-width:140px}
  #ui button{margin:3px 3px 0 0;padding:5px 9px;border-radius:7px;border:0;cursor:pointer;background:#e8f4ff}
  #ui a{color:#9df}
  #stats{margin-top:8px;padding-top:8px;border-top:1px solid #fff3;font-size:13px;line-height:1.5}
  #toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);color:#fff;font-size:20px;letter-spacing:.08em;text-shadow:0 2px 10px #000;opacity:0;transition:opacity 1.5s;pointer-events:none;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="menuBtn" title="Menu (M)">☰</div>
<div id="ui" class="hide">
  <h3>🐟 Kitty Aquarium</h3>
  <label>Scene <select id="env"><option value="auto">Auto (changes itself)</option></select></label>
  <label>Scene lasts <select id="dur"><option value="120">2 min</option><option value="300" selected>5 min</option><option value="900">15 min</option></select></label>
  <label>Fish <input id="count" type="range" min="4" max="50" value="20"></label>
  <label>Speed <input id="speed" type="range" min="0.3" max="2.5" step="0.1" value="1"></label>
  <label>Surprise events <input id="events" type="checkbox" checked></label>
  <label>Match real time of day <input id="tod" type="checkbox"></label>
  <label>Water sounds <input id="sound" type="checkbox"></label>
  <label>Show names on events <input id="names" type="checkbox" checked></label>
  <button id="next">Next scene</button><button id="event">Surprise!</button><button id="food">Feed</button><button id="fs">Fullscreen</button>
  <div id="stats"></div>
  <div style="margin-top:8px;font-size:12px;opacity:.8">Tap = paw (fish scatter, tap a fish to catch it) · Hold = drop food · M = menu</div>
  <div style="margin-top:6px"><a href="3d.html">3D version</a></div>
</div>
<div id="toast"></div>
<script>
'use strict';
const c=document.getElementById('c'),x=c.getContext('2d'),$=id=>document.getElementById(id);

const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>clamp(Math.round(amt<0?v*(1+amt):v+(255-v)*amt),0,255);return `rgb(${f(r)},${f(g)},${f(b)})`}

 // ---- special body plans
 'Moon Jelly':{kind:'jelly',len:80,c:['#f7c6ff'],hab:['reef','deep','night','cold','kelp','wreck','vent','lagoon'],spd:.3,glow:true},

 'Sea Turtle':{kind:'turtle',len:220,c:['#5a6a2a','#8a7a3a'],hab:['reef','lagoon','kelp','wreck'],spd:.5,big:true},

};
const NAMES=Object.keys(SP);

// ================= ENVIRONMENTS =================
const ENVS={
 reef:{name:'Tropical Reef',w:['#43c6e3','#1178a8','#07385c'],sand:'#e9d6a0',rays:1,coral:34,grass:10,rocks:6,anem:5,sil:'reef',hab:'reef'},

 amazon:{name:'Amazon River',w:['#a88a4a','#5a4020','#1e1408'],sand:'#6a5030',rays:.5,grass:14,roots:9,leaves:1,rocks:4,sil:'roots',hab:'amazon'},
 arctic:{name:'Arctic Waters',w:['#cdeef8','#3a8ab0','#0a2a48'],sand:'#8a939a',rays:.7,rocks:12,ice:1,grass:4,sil:'ice',hab:'cold'},
};
const ENV_KEYS=Object.keys(ENVS);
const poolFor=e=>NAMES.filter(n=>SP[n].hab.includes(e.hab));

// ================= STATE =================
let env=ENVS.reef, envKey='reef', speed=1, fish=[], crabs=[], bubbles=[], food=[], ripples=[], sparks=[], particles=[], plants=[], vents=[];
let bg=document.createElement('canvas'), bgx=bg.getContext('2d');
let trans=null, sceneTimer=0, eventTimer=R(40,90), time=0;
let stats={taps:0,catches:0,seen:{}};
try{Object.assign(stats,JSON.parse(localStorage.getItem('kittyAquariumStats')||'{}'))}catch(e){}
const saveStats=()=>{try{localStorage.setItem('kittyAquariumStats',JSON.stringify(stats))}catch(e){}};

function resize(){DPR=Math.min(devicePixelRatio||1,2);W=c.width=innerWidth*DPR;H=c.height=innerHeight*DPR;S=H/800;bg.width=W;bg.height=H;buildBG()}
addEventListener('resize',resize);

// scale texture
const scaleTile=(()=>{const t=document.createElement('canvas');t.width=10;t.height=8;const g=t.getContext('2d');
  g.strokeStyle='rgba(0,0,0,.5)';g.lineWidth=.7;for(const [ox,oy] of [[0,0],[5,4],[10,0],[0,8],[10,8]]){g.beginPath();g.arc(ox,oy,4.2,-.2,Math.PI*.6);g.stroke()}
  g.strokeStyle='rgba(255,255,255,.6)';g.lineWidth=.5;for(const [ox,oy] of [[0,0],[5,4],[10,0],[0,8],[10,8]]){g.beginPath();g.arc(ox-.6,oy-.4,3.4,-.9,.3);g.stroke()}
  return x.createPattern(t,'repeat')})();

// ================= BACKGROUND (cached) =================
const sandY=()=>H*.86;
const sandAt=xx=>sandY()+Math.sin(xx/W*9+env.seed)*H*.012+Math.sin(xx/W*23+env.seed*2)*H*.005;
function buildBG(){const g=bgx,e=env;if(!e.seed)e.seed=R(0,100);
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,e.w[0]);gr.addColorStop(.55,e.w[1]);gr.addColorStop(1,e.w[2]);g.fillStyle=gr;g.fillRect(0,0,W,H);
  // distant silhouettes
  g.fillStyle=hexA(e.w[1].startsWith('#')?e.w[1]:'#113355',.0);
  const far=shade(e.w[1],-.35),farA=0.55;g.globalAlpha=farA;g.fillStyle=far;
  if(e.sil==='reef'||e.sil==='dunes'||e.sil==='stones'||e.sil==='bank'){g.beginPath();g.moveTo(0,H);for(let i=0;i<=40;i++){const xx=i/40*W;g.lineTo(xx,H*.72-Math.abs(Math.sin(i*.7+e.seed))*H*(e.sil==='reef'?.12:.05)-Math.sin(i*.23)*H*.03)}g.lineTo(W,H);g.fill()}
  if(e.sil==='ship'){g.save();g.translate(W*.62,H*.8);g.rotate(-.12);g.beginPath();g.moveTo(-W*.3,0);g.lineTo(W*.25,0);g.lineTo(W*.32,-H*.16);g.lineTo(-W*.34,-H*.16);g.closePath();g.fill();
    g.fillRect(-W*.12,-H*.3,W*.14,H*.15);g.fillRect(-W*.2,-H*.52,W*.012,H*.37);g.fillRect(W*.1,-H*.46,W*.01,H*.3);g.globalAlpha=farA*.6;g.fillStyle=shade(e.w[1],.1);
    for(let i=0;i<8;i++){g.beginPath();g.arc(-W*.25+i*W*.07,-H*.08,H*.012,0,7);g.fill()}g.restore();g.globalAlpha=farA;g.fillStyle=far}
  if(e.sil==='kelp'||e.sil==='roots'){g.globalAlpha=.35;for(let i=0;i<24;i++){const xx=R(0,W);g.lineWidth=R(6,14)*S;g.strokeStyle=far;g.beginPath();
    if(e.sil==='roots'){g.moveTo(xx,-10);g.bezierCurveTo(xx+R(-80,80)*S,H*.3,xx+R(-120,120)*S,H*.6,xx+R(-60,60)*S,H*.85)}else{g.moveTo(xx,H);g.bezierCurveTo(xx+R(-40,40)*S,H*.6,xx+R(-40,40)*S,H*.3,xx+R(-30,30)*S,0)}g.stroke()}g.globalAlpha=farA}
  if(e.sil==='spires'){for(let i=0;i<9;i++){const xx=R(0,W),hh=R(.15,.4)*H,ww=R(20,60)*S;g.beginPath();g.moveTo(xx-ww,H*.9);g.lineTo(xx-ww*.3,H*.9-hh);g.lineTo(xx+ww*.3,H*.9-hh*.95);g.lineTo(xx+ww,H*.9);g.fill()}}
  if(e.sil==='ice'){g.globalAlpha=.9;g.fillStyle='#eaf8ff';g.beginPath();g.moveTo(0,0);for(let i=0;i<=30;i++)g.lineTo(i/30*W,H*(.05+Math.abs(Math.sin(i*1.7+e.seed))*.09));g.lineTo(W,0);g.fill();
    g.globalAlpha=.25;for(let i=0;i<6;i++){const xx=R(0,W);g.beginPath();g.moveTo(xx-60*S,H*.08);g.lineTo(xx,H*R(.2,.35));g.lineTo(xx+60*S,H*.08);g.fill()}}
  g.globalAlpha=1;
  // sand
  const sy=sandY();const sd=g.createLinearGradient(0,sy-H*.03,0,H);sd.addColorStop(0,shade(e.sand,-.25));sd.addColorStop(.3,e.sand);sd.addColorStop(1,shade(e.sand,-.15));
  g.fillStyle=sd;g.beginPath();g.moveTo(0,H);for(let i=0;i<=80;i++){const xx=i/80*W;g.lineTo(xx,sandAt(xx))}g.lineTo(W,H);g.fill();
  for(let i=0;i<W*H/900;i++){const xx=R(0,W),yy=R(sy,H);g.fillStyle=`rgba(${chance(.5)?'255,255,255':'0,0,0'},${R(.04,.12)})`;g.fillRect(xx,yy,R(1,2.5)*S,R(1,2.5)*S)}
  // ripples in sand
  g.strokeStyle='rgba(0,0,0,.06)';g.lineWidth=2*S;for(let i=0;i<30;i++){const yy=R(sy+10*S,H),xx=R(0,W);g.beginPath();g.moveTo(xx,yy);g.quadraticCurveTo(xx+40*S,yy-6*S,xx+90*S,yy);g.stroke()}
  if(e.leaves)for(let i=0;i<60;i++){const xx=R(0,W),yy=R(sy,H);g.save();g.translate(xx,yy);g.rotate(R(0,6));g.fillStyle=pick(['#5a3a14','#7a4a18','#4a2e10','#8a5a20']);g.beginPath();g.ellipse(0,0,14*S,6*S,0,0,7);g.fill();g.restore()}
  // rocks
  for(let i=0;i<(e.rocks||0);i++){const xx=R(0,W),r=R(18,70)*S*(e.sil==='stones'?.8:1),yy=sandAt(xx)+r*.3;
    const rg=g.createRadialGradient(xx-r*.35,yy-r*.5,r*.1,xx,yy,r*1.3);const base=e.glow?'#2a2630':e.sil==='stones'?pick(['#8a8478','#6a665e','#9a9080']):'#7a7468';
    rg.addColorStop(0,shade(base,.35));rg.addColorStop(.6,base);rg.addColorStop(1,shade(base,-.6));g.fillStyle=rg;
    g.beginPath();g.moveTo(xx-r*1.3,yy+r*.2);g.bezierCurveTo(xx-r*1.2,yy-r*.9,xx+r*.1,yy-r*1.2,xx+r*.6,yy-r*.8);g.bezierCurveTo(xx+r*1.3,yy-r*.5,xx+r*1.4,yy,xx+r*1.3,yy+r*.2);g.closePath();g.fill();
    if(!e.glow&&e.hab!=='cold'){g.fillStyle='rgba(60,120,40,.25)';g.beginPath();g.ellipse(xx,yy-r*.8,r*.7,r*.25,0,0,7);g.fill()}}
  // coral (static, sways subtly via plants for soft ones)
  for(let i=0;i<(e.coral||0);i++)drawCoral(g,R(0,W),pick(e.glow?['#8a3ad8','#20c0c0','#e040a0','#4060ff']:['#ff6a5a','#ff9a3a','#e84393','#a55eea','#f8c850','#ff7eb3','#5ad0b0','#c8e05a']),R(.6,1.4));
  // anemones drawn animated later; starfish + shells
  if(!e.glow&&e.hab!=='cold'&&e.hab!=='amazon')for(let i=0;i<RI(2,5);i++){const xx=R(0,W),yy=R(sy+15*S,H*.97);drawStar(g,xx,yy,R(10,18)*S,pick(['#ff6a3a','#e8a030','#c8405a','#8a3ad8']))}

}
function drawCoral(g,xx,col,sc){const y0=sandAt(xx)+4*S,type=RI(0,3);g.save();g.translate(xx,y0);g.scale(sc*S,sc*S);
  const dark=shade(col,-.35);
  if(type===0){ // branching
    const br=(x0,y0,a,l,w,d)=>{const x1=x0+Math.sin(a)*l,y1=y0-Math.cos(a)*l;g.strokeStyle=d>1?dark:col;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();
      if(d>0){br(x1,y1,a-R(.2,.6),l*.75,w*.75,d-1);br(x1,y1,a+R(.2,.6),l*.75,w*.75,d-1)}else{g.fillStyle=shade(col,.3);g.beginPath();g.arc(x1,y1,w*.7,0,7);g.fill()}};
    br(0,0,R(-.2,.2),R(25,40),9,4)}
  else if(type===1){ // brain coral
    const r=R(25,45);const rg=g.createRadialGradient(-r*.3,-r*.5,2,0,-r*.2,r*1.2);rg.addColorStop(0,shade(col,.3));rg.addColorStop(1,dark);g.fillStyle=rg;g.beginPath();g.ellipse(0,-r*.35,r,r*.75,0,Math.PI,0);g.fill();
    g.strokeStyle=shade(col,-.5);g.lineWidth=1.5;for(let k=0;k<9;k++){g.beginPath();g.moveTo(-r*.8+k*r*.2,-r*.1);g.bezierCurveTo(-r*.7+k*r*.2,-r*.5,-r*.9+k*r*.2,-r*.7,-r*.75+k*r*.2,-r*.9);g.stroke()}}
  else if(type===2){ // fan coral
    g.strokeStyle=col;g.lineWidth=1.2;g.globalAlpha=.85;for(let k=0;k<40;k++){const a=R(-1.1,1.1),l=R(40,70);g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(Math.sin(a)*l*.4,-l*.5,Math.sin(a)*l,-Math.cos(a)*l);g.stroke()}
    g.globalAlpha=1;g.strokeStyle=dark;g.lineWidth=4;g.beginPath();g.moveTo(0,0);g.lineTo(0,-15);g.stroke()}
  else { // tube / plate
    for(let k=0;k<RI(3,7);k++){const hx=R(-20,20),hh=R(15,45),w=R(5,9);const tg=g.createLinearGradient(hx-w,0,hx+w,0);tg.addColorStop(0,dark);tg.addColorStop(.5,col);tg.addColorStop(1,dark);
      g.fillStyle=tg;g.fillRect(hx-w/2,-hh,w,hh);g.fillStyle=shade(col,-.6);g.beginPath();g.ellipse(hx,-hh,w/2,w/5,0,0,7);g.fill()}}
  g.restore();}
function drawStar(g,xx,yy,r,col){g.save();g.translate(xx,yy);g.rotate(R(0,6));g.scale(1,.55);g.fillStyle=col;g.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5,rr=i%2?r*.42:r;g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}g.closePath();g.fill();
  g.fillStyle='rgba(255,255,255,.35)';for(let i=0;i<12;i++){g.beginPath();g.arc(R(-r*.4,r*.4),R(-r*.4,r*.4),r*.06,0,7);g.fill()}g.restore()}

// animated plants
function buildPlants(){plants=[];const e=env;
  const add=(type,n,opts)=>{for(let i=0;i<(n||0);i++)plants.push({type,x:R(-.02,1.02)*W,ph:R(0,6),front:chance(opts?.front??.25),...opts?.gen?.()})};
  add('grass',e.grass,{gen:()=>({h:R(40,140)*S,col:pick(e.glow?['#1e3799','#3c6382','#0a5a5a']:e.hab==='amazon'?['#4a6a1a','#6a8a2a','#3a5a14']:['#2ecc71','#27ae60','#6ab04c','#1e8449','#9ccc65']),blades:RI(3,7)})});
  add('kelp',e.kelp,{front:.2,gen:()=>({h:R(.5,.95)*H,col:pick(['#7a8b2d','#8f9c3a','#5c6e1e','#a0a040'])})});
  add('reed',e.reeds,{front:.3,gen:()=>({h:R(.4,.8)*H,col:pick(['#5a7a2a','#6a8a3a','#4a6a1a'])})});
  add('anem',e.anem,{front:0,gen:()=>({col:pick(['#ff7eb3','#ffb347','#9b59b6','#7ee8fa']),r:R(18,30)*S})});
  add('root',e.roots,{front:.4,gen:()=>({w:R(8,22)*S,bend:R(-1,1),col:pick(['#2a1a0a','#3a2410','#1e1206'])})});
  vents=[];for(let i=0;i<(e.vents||0);i++)vents.push({x:R(.1,.9)*W});
}
function drawPlant(p){const t=time,g=x;
  if(p.type==='grass'){const base=sandAt(p.x)+6*S;g.lineCap='round';for(let b=0;b<p.blades;b++){const bx=p.x+(b-p.blades/2)*5*S,h=p.h*(.6+.4*Math.sin(b*2.3+p.ph));
      g.strokeStyle=shade(p.col,(b%3-1)*.12);g.lineWidth=4*S*(1-b%2*.3);g.beginPath();g.moveTo(bx,base);
      const sw=Math.sin(t*1.1+p.ph+b*.5)*h*.18;g.quadraticCurveTo(bx+sw*.4,base-h*.55,bx+sw,base-h);g.stroke()}}
  else if(p.type==='kelp'){const base=sandAt(p.x)+6*S;g.strokeStyle=p.col;g.lineWidth=7*S;g.beginPath();g.moveTo(p.x,base);let px=p.x,py=base;
    for(let j=1;j<=14;j++){const k=j/14,nx=p.x+Math.sin(t*.7+p.ph+j*.35)*k*50*S,ny=base-p.h*k;g.lineTo(nx,ny);
      if(j%2===0){g.save();g.fillStyle=hexA('#8a9a3a',.85);g.translate(nx,ny);g.rotate(Math.sin(t+j+p.ph)*.4+(j%4?.9:-.9));g.beginPath();g.ellipse(18*S,0,20*S,7*S,0,0,7);g.fill();g.restore()}px=nx;py=ny}g.stroke();
    g.fillStyle='#b8a040';g.beginPath();g.arc(px,py,5*S,0,7);g.fill()}
  else if(p.type==='reed'){const base=sandAt(p.x)+6*S;g.strokeStyle=p.col;g.lineWidth=5*S;g.beginPath();g.moveTo(p.x,base);g.quadraticCurveTo(p.x+Math.sin(t*.6+p.ph)*20*S,base-p.h*.5,p.x+Math.sin(t*.6+p.ph)*35*S,base-p.h);g.stroke()}
  else if(p.type==='anem'){const base=sandAt(p.x);g.fillStyle=shade(p.col,-.3);g.beginPath();g.ellipse(p.x,base,p.r*.6,p.r*.3,0,Math.PI,0);g.fill();g.strokeStyle=p.col;g.lineCap='round';g.lineWidth=4*S;
    for(let k=0;k<16;k++){const a=-Math.PI*.9+k/15*Math.PI*.8,sw=Math.sin(t*1.5+k+p.ph)*.25;g.beginPath();g.moveTo(p.x+Math.cos(a)*p.r*.4,base-p.r*.2);g.quadraticCurveTo(p.x+Math.cos(a+sw)*p.r*.9,base-p.r*.6+Math.sin(a)*p.r*.4,p.x+Math.cos(a+sw*1.5)*p.r*1.2,base+Math.sin(a+sw)*p.r*1.1);g.stroke()}}
  else if(p.type==='root'){g.strokeStyle=p.col;g.lineWidth=p.w;g.lineCap='round';g.beginPath();g.moveTo(p.x,-20);g.bezierCurveTo(p.x+p.bend*120*S,H*.3,p.x-p.bend*80*S,H*.55,p.x+p.bend*60*S,sandAt(p.x)+10*S);g.stroke();
    g.lineWidth=p.w*.4;g.beginPath();g.moveTo(p.x+p.bend*40*S,H*.4);g.quadraticCurveTo(p.x+p.bend*140*S,H*.6,p.x+p.bend*180*S,sandAt(p.x)+10*S);g.stroke()}
}

// ================= FISH =================
function spawn(name,opts={}){const sp=SP[name];const z=opts.z??R(.5,1.15);const dir=opts.dir??(chance(.5)?1:-1);
  const f={name,sp,z,scaleV:R(.85,1.15),x:opts.x??(dir>0?-R(100,300)*S:W+R(100,300)*S),y:opts.y??R(.12,.78)*H,vx:dir*R(.5,1)*sp.spd,vy:0,face:dir,ph:R(0,6),
    tx:0,ty:0,tt:0,scared:0,puff:0,leaving:false,cols:sp.variants&&chance(.6)?pick(sp.variants):sp.c,marks:genMarks(sp),event:opts.event};
  if(sp.bottom)f.y=sandY()-R(5,25)*S;
  if(sp.kind==='jelly'){f.y=opts.y??R(.3,.95)*H;f.x=opts.x??R(0,W)}
  newTarget(f);if(!stats.seen[name]){stats.seen[name]=1;saveStats()}return f;}
function genMarks(sp){const m={};for(const p of sp.pat||[]){
  if(p[0]==='spots')m.spots=Array.from({length:p[2]},()=>[R(-45,40),R(-1,1),R(p[3],p[4])]);
  if(p[0]==='blotch')m.blotch=Array.from({length:p[2]},()=>[R(-40,40),R(-1,.6),R(8,20),R(5,12),pick(p[1]),R(0,3)]);
  if(p[0]==='squiggle')m.sq=Array.from({length:p[2]},()=>[R(-40,35),R(-.8,.8),R(-1,1),R(-1,1)]);}
  return m;}
function newTarget(f){const sp=f.sp;f.tx=R(-.05,1.05)*W;f.ty=sp.bottom?sandY()-R(5,20)*S:sp.kind==='jelly'?f.y-R(50,200)*S:R(.1,.8)*H;f.tt=R(4,12)}
function hh(f){return f.sp.h*50*(1+f.puff*.8)}

function wave(f){const A=(f.sp.kind?0:9)*(.6+Math.min(Math.hypot(f.vx,f.vy),3)*.25),ph=f.ph;return xx=>Math.sin(ph-xx*.055)*A*Math.pow((50-xx)/100,2)}
function finFill(col,a){return hexA(col.startsWith('#')?col:'#888888',a)}

function drawFishBody(f){const sp=f.sp,h=hh(f),nose=sp.nose,w=wave(f),[back,mid,belly]=f.cols;
  const tl=sp.tail==='veil'?70:sp.tail==='fan'?50:sp.tail==='shark'?45:28,th=h*(sp.tail==='veil'?1.6:sp.tail==='fan'?1.3:1.05);
  const finCol=sp.fin==='auto'?mid:(f.cols!==sp.c&&sp.variants?mid:sp.fin),tailCol=sp.tailC||finCol,finA=sp.tail==='veil'?.6:.85;
  const bx=-46;
  // ---- tail
  const T=(xx)=>w(xx);x.fillStyle=finFill(tailCol,finA);
  const tail=()=>{x.beginPath();
    if(sp.tail==='fork'||sp.tail==='lunate'){const n=sp.tail==='lunate'?.35:.6;x.moveTo(bx+3,T(bx)-h*.18);x.quadraticCurveTo(bx-tl*.4,T(bx-tl*.4)-th*.5,bx-tl,T(bx-tl)-th);x.quadraticCurveTo(bx-tl*n,T(bx-tl*n),bx-tl,T(bx-tl)+th);x.quadraticCurveTo(bx-tl*.4,T(bx-tl*.4)+th*.5,bx+3,T(bx)+h*.18)}
    else if(sp.tail==='round'){x.moveTo(bx+3,T(bx)-h*.2);x.bezierCurveTo(bx-tl*.6,T(bx)-th*1.1,bx-tl*1.3,T(bx-tl)-th*.3,bx-tl*1.2,T(bx-tl));x.bezierCurveTo(bx-tl*1.3,T(bx-tl)+th*.3,bx-tl*.6,T(bx)+th*1.1,bx+3,T(bx)+h*.2)}
    else if(sp.tail==='truncate'){x.moveTo(bx+3,T(bx)-h*.2);x.lineTo(bx-tl,T(bx-tl)-th*.8);x.quadraticCurveTo(bx-tl*1.05,T(bx-tl),bx-tl,T(bx-tl)+th*.8);x.lineTo(bx+3,T(bx)+h*.2)}
    else if(sp.tail==='shark'){x.moveTo(bx+5,T(bx)-h*.15);x.quadraticCurveTo(bx-tl*.5,T(bx-tl*.5)-th*1.2,bx-tl,T(bx-tl)-th*2.2);x.quadraticCurveTo(bx-tl*.5,T(bx-tl*.5)-th*.2,bx-tl*.45,T(bx-tl*.45)+th*.2);x.quadraticCurveTo(bx-tl*.4,T(bx-tl*.4)+th*.9,bx-tl*.6,T(bx-tl*.6)+th*1.2);x.quadraticCurveTo(bx-tl*.2,T(bx)+h*.4,bx+5,T(bx)+h*.15)}
    else if(sp.tail==='veil'||sp.tail==='fan'){x.moveTo(bx+4,T(bx)-h*.3);const n=8;for(let i=0;i<=n;i++){const k=i/n,a=-1+2*k,xx=bx-tl*(.7+.3*Math.cos(a*1.3))+Math.sin(time*2+i)*3;x.lineTo(xx,T(xx)+a*th+Math.sin(f.ph*.7+i)*4)}x.lineTo(bx+4,T(bx)+h*.3)}
    x.closePath();x.fill();
    // fin rays
    x.strokeStyle='rgba(0,0,0,.14)';x.lineWidth=.6;for(let i=-4;i<=4;i++){x.beginPath();x.moveTo(bx,T(bx));x.lineTo(bx-tl*.95,T(bx-tl*.95)+i/4*th*.95);x.stroke()}};
  tail();if(sp.tail==='fan'){x.save();x.translate(0,4);x.globalAlpha*=.6;tail();x.restore()}
  // ---- dorsal / anal fins
  x.fillStyle=finFill(finCol,finA*.95);
  const dtop=-h*.9;
  const fin=(pts)=>{x.beginPath();x.moveTo(pts[0],w(pts[0])+pts[1]);for(let i=2;i<pts.length;i+=4)x.quadraticCurveTo(pts[i],w(pts[i])+pts[i+1],pts[i+2],w(pts[i+2])+pts[i+3]);x.closePath();x.fill()};
  const D=sp.dorsal;
  if(D==='low')fin([-25,dtop*.85,-10,dtop*1.35,5,dtop*.9]);
  if(D==='tall')fin([-20,dtop*.9,-10,dtop*1.9,10,dtop*.9]);
  if(D==='long')fin([-40,dtop*.55,-10,dtop*1.45,25,dtop*.85]);
  if(D==='sail'){fin([-42,dtop*.5,-30,dtop*2.6,20,dtop*.9]);fin([-40,-dtop*.5,-30,-dtop*2.3,5,-dtop*.9])}
  if(D==='shark')fin([-10,dtop*.9,0,dtop*2.3,12,dtop*.95]);
  if(D==='banner'){fin([-15,dtop*.9,-5,dtop*1.6,8,dtop*.9]);x.strokeStyle='rgba(250,250,245,.95)';x.lineWidth=2.5;x.beginPath();x.moveTo(-5,dtop*1.4);x.bezierCurveTo(-20,dtop*2.6,-45,dtop*2.8+Math.sin(f.ph)*4,-70,dtop*2.4+Math.sin(f.ph*.8)*8);x.stroke()}
  if(D==='spiny'){x.beginPath();x.moveTo(-35,w(-35)+dtop*.6);for(let i=0;i<=8;i++){const xx=-35+i*6;x.lineTo(xx,w(xx)+dtop*(1.25+(i%2?-.2:.1)));}x.lineTo(15,w(15)+dtop*.85);x.closePath();x.fill()}
  if(D==='spines'){x.strokeStyle=finFill(finCol,.9);x.lineWidth=1.6;for(let i=0;i<13;i++){const xx=-30+i*5,l=35+Math.sin(i)*8;x.beginPath();x.moveTo(xx,w(xx)+dtop*.8);x.lineTo(xx-8,w(xx)+dtop*.8-l);x.stroke();
      x.fillStyle=finFill(finCol,.35);x.beginPath();x.moveTo(xx,w(xx)+dtop*.8);x.lineTo(xx-8,w(xx)+dtop*.8-l);x.lineTo(xx+5,w(xx)+dtop*.8);x.fill()}}
  // anal fin (not for sharks' / sail already)
  if(D!=='sail'&&D!=='none')fin([-35,-dtop*.7,-22,-dtop*(sp.h>.6?1.7:1.3),-8,-dtop*.9]);
  if(sp.lionPec){for(let i=0;i<9;i++){const a=.3+i*.14+Math.sin(f.ph*.5)*.05;x.strokeStyle=i%2?'#f5e0d0':'#b04a2a';x.lineWidth=2;x.beginPath();x.moveTo(15,h*.2);x.quadraticCurveTo(15-Math.cos(a)*30,h*.2+Math.sin(a)*25,15-Math.cos(a)*55,h*.2+Math.sin(a)*50);x.stroke()}
    x.fillStyle='rgba(240,200,180,.35)';x.beginPath();x.moveTo(15,h*.2);x.lineTo(-40,h*.3);x.lineTo(-25,h*1.6);x.closePath();x.fill()}
  // ---- body
  const ns=h*(.1+nose*.9);
  x.beginPath();x.moveTo(50,w(50)+h*.08);
  x.bezierCurveTo(50,w(50)-ns,30,w(30)-h*1.02,5,w(5)-h);
  x.bezierCurveTo(-20,w(-20)-h*.95,-36,w(-36)-h*.42,bx,w(bx)-h*.18);
  x.lineTo(bx,w(bx)+h*.18);
  x.bezierCurveTo(-36,w(-36)+h*.42,-20,w(-20)+h*.95,5,w(5)+h);
  x.bezierCurveTo(30,w(30)+h*1.02,50,w(50)+ns*.8,50,w(50)+h*.08);x.closePath();
  const bg=x.createLinearGradient(0,-h,0,h);bg.addColorStop(0,back);bg.addColorStop(.45,mid);bg.addColorStop(1,belly);x.fillStyle=bg;x.fill();
  x.save();x.clip();
  // patterns
  for(const p of sp.pat||[]){const t=p[0];
    if(t==='bands'){p[2].forEach((bx2,i)=>{const bw=p[3][i];x.fillStyle=p[1];x.beginPath();x.moveTo(bx2-bw/2,w(bx2)-h*1.3);x.quadraticCurveTo(bx2-bw/2-3,w(bx2),bx2-bw/2,w(bx2)+h*1.3);x.lineTo(bx2+bw/2,w(bx2)+h*1.3);x.quadraticCurveTo(bx2+bw/2+3,w(bx2),bx2+bw/2,w(bx2)-h*1.3);x.fill();
      if(p[4]){x.strokeStyle=p[4];x.lineWidth=1.8;x.stroke()}})}
    if(t==='vbars'){const n=p[2];for(let i=0;i<n;i++){const bx2=-40+i*(80/(n-1||1));x.fillStyle=p[1];x.fillRect(bx2-p[3]/2,w(bx2)-h*1.2,p[3],h*2.4);if(p[4]){x.fillStyle=p[4];x.fillRect(bx2+p[3]/2,w(bx2)-h*1.2,p[3]*.6,h*2.4)}}}
    if(t==='hstripe'){x.fillStyle=p[1];x.beginPath();x.moveTo(p[4],w(p[4])+p[2]*h);for(let xx=p[4];xx<=p[5];xx+=10)x.lineTo(xx,w(xx)+p[2]*h);for(let xx=p[5];xx>=p[4];xx-=10)x.lineTo(xx,w(xx)+(p[2]+p[3])*h);x.fill();
      if(sp.glowStripe){x.save();x.globalCompositeOperation='lighter';x.globalAlpha=.25;x.fill();x.restore()}}
    if(t==='spots'&&f.marks.spots){x.fillStyle=p[1];for(const [sx,sy,r] of f.marks.spots){x.beginPath();x.arc(sx,w(sx)+sy*h*.9,r,0,7);x.fill()}}
    if(t==='blotch'&&f.marks.blotch)for(const [sx,sy,rx,ry,col,a] of f.marks.blotch){x.fillStyle=col;x.beginPath();x.ellipse(sx,w(sx)+sy*h,rx,ry,a,0,7);x.fill()}
    if(t==='squiggle'&&f.marks.sq){x.strokeStyle=p[1];x.lineWidth=3.5;x.lineCap='round';for(const [sx,sy,a,b] of f.marks.sq){x.beginPath();x.moveTo(sx,w(sx)+sy*h);x.bezierCurveTo(sx+8,w(sx)+sy*h+a*12,sx+4,w(sx)+sy*h+b*12,sx+14,w(sx+14)+sy*h);x.stroke()}}
    if(t==='mask'){x.fillStyle=p[1];x.fillRect(p[2]-5,w(p[2])-h*1.2,10,h*2.4)}
    if(t==='ocellus'){const ox=p[2],oy=p[3]*h;x.fillStyle=p[1];x.beginPath();x.arc(ox,w(ox)+oy,6,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=1.5;x.stroke()}
    if(t==='tang'){x.fillStyle=p[1];x.beginPath();x.moveTo(35,w(35)-h*.55);x.bezierCurveTo(10,w(10)-h*.9,-25,w(-25)-h*.6,-44,w(-44)-h*.05);x.bezierCurveTo(-30,w(-30)-h*.25,-10,w(-10)-h*.2,-5,w(-5)+h*.05);x.bezierCurveTo(-15,w(-15)-h*.35,10,w(10)-h*.5,35,w(35)-h*.4);x.fill()}
    if(t==='gradientTail'){const gg=x.createLinearGradient(p[2]-10,0,p[2]+10,0);gg.addColorStop(0,p[1]);gg.addColorStop(1,hexA(p[1],0));x.fillStyle=gg;x.fillRect(-60,-h*1.3,p[2]+70,h*2.6)}
    if(t==='wavyH'){x.strokeStyle=p[1];x.lineWidth=2.5;for(let i=0;i<p[2];i++){const yy=-h*.8+i*(h*1.6/(p[2]-1));x.beginPath();for(let xx=-50;xx<=50;xx+=4)x.lineTo(xx,w(xx)+yy+Math.sin(xx*.25+i)*2.5);x.stroke()}}
    if(t==='scalesBig'){x.strokeStyle=hexA(p[1],.55);x.lineWidth=1.2;for(let yy=-h;yy<h;yy+=7)for(let xx=-45+(Math.round(yy/7)%2)*4;xx<40;xx+=8){x.beginPath();x.arc(xx,w(xx)+yy,4.5,-1.2,1.2);x.stroke()}}
    if(t==='photophores'){x.fillStyle=p[1];for(let xx=-38;xx<35;xx+=6){x.beginPath();x.arc(xx,w(xx)+h*.65,1.6,0,7);x.fill()}}
  }
  // fine scales, shading, sheen
  x.globalAlpha*=.18;x.fillStyle=scaleTile;x.fillRect(-50,-h*1.3,85,h*2.6);x.globalAlpha/=.18;
  const sh=x.createLinearGradient(0,-h,0,h);sh.addColorStop(0,'rgba(0,0,0,.35)');sh.addColorStop(.3,'rgba(0,0,0,0)');sh.addColorStop(.72,'rgba(255,255,255,.08)');sh.addColorStop(1,'rgba(0,0,0,.28)');x.fillStyle=sh;x.fillRect(-60,-h*1.3,120,h*2.6);
  const sp2=x.createLinearGradient(0,-h*.9,0,-h*.1);sp2.addColorStop(0,'rgba(255,255,255,0)');sp2.addColorStop(.6,`rgba(255,255,255,${(sp.shiny?.4:.18)+.08*Math.sin(f.ph*.9)})`);sp2.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=sp2;x.beginPath();x.ellipse(5,-h*.45,38,h*.3,0,0,7);x.fill();
  x.strokeStyle='rgba(0,0,0,.28)';x.lineWidth=1.3;x.beginPath();x.arc(46-nose*6,w(40)+h*.05,h*.75,Math.PI*.7,Math.PI*1.3);x.stroke(); // gill
  x.strokeStyle='rgba(0,0,0,.12)';x.lineWidth=1;x.beginPath();x.moveTo(-44,w(-44));x.quadraticCurveTo(0,w(0)-h*.35,34,w(34)-h*.3);x.stroke(); // lateral line
  x.restore();
  if(f.puff>.05){x.strokeStyle='rgba(60,50,20,.7)';x.lineWidth=1.2;for(let a=0;a<6.28;a+=.35){const rx=Math.cos(a)*44,ry=Math.sin(a)*h;x.beginPath();x.moveTo(rx,ry);x.lineTo(rx*(1+.15*f.puff),ry*(1+.25*f.puff));x.stroke()}}
  // pectoral fin (flapping)
  x.fillStyle=finFill(finCol,.55);x.save();x.translate(22,h*.3);x.rotate(.5+Math.sin(f.ph*1.7)*.35);x.beginPath();x.ellipse(-10,0,13,h*.22+3,0,0,7);x.fill();x.restore();
  // mouth, whiskers, teeth
  x.strokeStyle='rgba(0,0,0,.45)';x.lineWidth=1.2;x.beginPath();x.moveTo(50,h*.1);x.lineTo(44,h*.18);x.stroke();
  if(sp.whiskers){x.strokeStyle='rgba(40,30,20,.6)';x.lineWidth=1;for(const s of [1,-1]){x.beginPath();x.moveTo(48,h*.15);x.quadraticCurveTo(58,h*.4*s+h*.2,54+Math.sin(f.ph)*2,h*.55*s+h*.25);x.stroke()}}
  if(sp.teeth){x.fillStyle='#eee';for(let i=0;i<6;i++){x.beginPath();x.moveTo(48-i*3,h*.15);x.lineTo(46.5-i*3,h*.35);x.lineTo(45-i*3,h*.15);x.fill()}}
  // eye
  const er=Math.max(3.2,5.5-sp.len/80),ex=38-nose*4,ey=-h*.22;
  x.fillStyle=sp.glow?'#cfe':'#f4efd8';x.beginPath();x.arc(ex,ey,er,0,7);x.fill();
  const ig=x.createRadialGradient(ex+1,ey,0,ex+1,ey,er*.8);ig.addColorStop(0,'#000');ig.addColorStop(.6,'#111');ig.addColorStop(1,'#6a5a2a');x.fillStyle=ig;x.beginPath();x.arc(ex+.8,ey,er*.75,0,7);x.fill();
  x.fillStyle='rgba(255,255,255,.95)';x.beginPath();x.arc(ex-.5,ey-er*.35,er*.28,0,7);x.fill();
  if(sp.lure){x.strokeStyle='#3e342c';x.lineWidth=1.5;const lx=62+Math.sin(time*1.3)*3,ly=-h*1.5+Math.cos(time)*3;x.beginPath();x.moveTo(40,-h*.8);x.quadraticCurveTo(60,-h*1.8,lx,ly);x.stroke();
    const lg=x.createRadialGradient(lx,ly,0,lx,ly,22);lg.addColorStop(0,'rgba(200,255,255,1)');lg.addColorStop(.2,'rgba(120,230,255,.6)');lg.addColorStop(1,'rgba(120,230,255,0)');x.fillStyle=lg;x.beginPath();x.arc(lx,ly,22,0,7);x.fill()}
}

function drawJelly(f){const sp=f.sp,p=Math.sin(f.ph*1.3),col=f.cols[0];
  x.save();if(env.glow){x.globalCompositeOperation='lighter'}
  const g=x.createRadialGradient(0,-10,2,0,0,55);g.addColorStop(0,'rgba(255,255,255,.55)');g.addColorStop(.5,hexA(col,.35));g.addColorStop(1,hexA(col,.08));
  x.fillStyle=g;x.beginPath();x.ellipse(0,0,50*(1-p*.1),38*(1+p*.12),0,Math.PI,0);x.quadraticCurveTo(0,10+p*4,-50*(1-p*.1),0);x.fill();
  if(sp.name!=='Sea Nettle'){x.strokeStyle=hexA(col,.6);x.lineWidth=2.2;for(let i=0;i<4;i++){x.beginPath();x.arc(-18+i*12,-14,6,0,7);x.stroke()}}
  x.strokeStyle=hexA(col,.45);x.lineWidth=1.2;const L=sp.long?260:130;
  for(let i=-6;i<=6;i++){x.beginPath();x.moveTo(i*7.5,2);for(let j=1;j<14;j++)x.lineTo(i*7.5*(1-j*.03)+Math.sin(f.ph*1.3-j*.5+i)*j*1.2,j*L/14);x.stroke()}
  x.lineWidth=5;x.strokeStyle=hexA(col,.3);for(let i=-1;i<=1;i++){x.beginPath();x.moveTo(i*8,0);for(let j=1;j<8;j++)x.lineTo(i*8+Math.sin(f.ph-j*.6+i)*j*2,j*L*.08);x.stroke()}
  x.restore();}
function drawSeahorse(f){const [a,b]=f.cols,t=f.ph;x.save();x.rotate(Math.sin(t*.4)*.1);x.fillStyle=a;x.strokeStyle=shade(a,-.35);x.lineWidth=2;
  x.beginPath();x.moveTo(8,-40);x.bezierCurveTo(24,-36,20,-18,8,-12);x.bezierCurveTo(20,0,18,18,4,26);x.bezierCurveTo(-4,32,-2,44,8,46);x.bezierCurveTo(14,48,12,40,6,40);x.bezierCurveTo(10,36,6,34,4,36);
  x.bezierCurveTo(-8,34,-12,20,-6,10);x.bezierCurveTo(-12,0,-8,-20,-2,-28);x.bezierCurveTo(-4,-38,2,-44,8,-40);x.fill();x.stroke();
  x.beginPath();x.moveTo(12,-38);x.lineTo(30,-34);x.lineTo(30,-30);x.lineTo(14,-32);x.fill();x.stroke();
  for(let i=0;i<10;i++){x.beginPath();x.moveTo(-7+i*.3,-20+i*5);x.lineTo(-2+i*.8,-20+i*5);x.stroke()}
  x.fillStyle=hexA(b,.6);x.beginPath();x.ellipse(-8,0,6,10+Math.sin(t*6)*2,0,0,7);x.fill();
  x.fillStyle='#111';x.beginPath();x.arc(10,-36,2.5,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(9.4,-36.8,.9,0,7);x.fill();x.restore()}
function drawTurtle(f){const [a,b]=f.cols,t=f.ph*.5,fl=Math.sin(t);x.fillStyle='#b8a878';
  x.save();x.translate(25,10);x.rotate(-.6+fl*.6);x.beginPath();x.ellipse(-8,24,10,34,0,0,7);x.fill();x.restore(); // front flipper
  x.save();x.translate(-28,10);x.rotate(.4-fl*.3);x.beginPath();x.ellipse(-6,10,8,16,0,0,7);x.fill();x.restore();
  x.beginPath();x.ellipse(52,-2,14,10,.1,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(58,-5,2.4,0,7);x.fill();
  const g=x.createRadialGradient(-5,-20,5,0,-5,55);g.addColorStop(0,shade(b,.2));g.addColorStop(1,shade(a,-.3));x.fillStyle=g;x.beginPath();x.ellipse(0,-2,48,26,0,0,7);x.fill();
  x.strokeStyle=shade(a,-.5);x.lineWidth=1.8;for(const [cx,cy,r] of [[0,-8,11],[-22,-4,10],[22,-4,10],[-10,10,9],[12,10,9],[-32,8,7],[32,8,7]]){x.beginPath();for(let k=0;k<6;k++){const an=k*Math.PI/3;x.lineTo(cx+Math.cos(an)*r,cy+Math.sin(an)*r*.8)}x.closePath();x.stroke()}
  x.save();x.translate(20,6);x.rotate(.5+fl*.7);x.fillStyle='#a89868';x.beginPath();x.ellipse(-10,28,11,38,.3,0,7);x.fill();x.restore();}
function drawRay(f){const [a,b]=f.cols,fl=Math.sin(f.ph*.6);x.fillStyle=a;x.beginPath();x.moveTo(40,0);
  x.bezierCurveTo(30,-20,0,-40+fl*25,-10,-58+fl*35);x.quadraticCurveTo(-20,-20,-30,-4);x.lineTo(-90,Math.sin(f.ph)*6);x.lineTo(-30,4);x.quadraticCurveTo(-20,20,-10,58-fl*35);x.bezierCurveTo(0,40-fl*25,30,20,40,0);x.fill();
  x.fillStyle=hexA(b,.25);x.beginPath();x.ellipse(5,-12,12,6,0,0,7);x.fill();
  x.fillStyle=a;x.beginPath();x.moveTo(40,-6);x.lineTo(52,-12);x.lineTo(44,0);x.lineTo(52,12);x.lineTo(40,6);x.fill();}
function drawEel(f){const [a,b]=f.cols;x.lineCap='round';const pts=[];for(let i=0;i<=24;i++){const xx=50-i*4.3;pts.push([xx,Math.sin(f.ph-i*.35)*i*.5])}
  for(let i=0;i<pts.length-1;i++){x.strokeStyle=i%3?a:shade(a,-.2);x.lineWidth=12*(1-i/pts.length*.6);x.beginPath();x.moveTo(...pts[i]);x.lineTo(...pts[i+1]);x.stroke()}
  x.fillStyle=hexA(b,.6);for(let i=2;i<20;i+=2){x.beginPath();x.arc(pts[i][0],pts[i][1]-2,1.6,0,7);x.fill()}
  x.fillStyle='#ffe';x.beginPath();x.arc(44,-3,2.2,0,7);x.fill();x.fillStyle='#000';x.beginPath();x.arc(44.5,-3,1.2,0,7);x.fill();
  x.strokeStyle='#300';x.lineWidth=1.2;x.beginPath();x.moveTo(50,1);x.lineTo(40,2+Math.max(0,Math.sin(time*2))*3);x.stroke()}

function drawCreature(f){const k=f.size/100;x.save();x.translate(f.x,f.y);
  const depthA=clamp(.35+f.z*.65,0,1);x.globalAlpha=f.alpha??depthA;
  if(env.glow&&(f.sp.glow||f.sp.kind==='jelly')){x.shadowColor=f.cols[1]||f.cols[0];x.shadowBlur=25*S}
  const sk=f.sp.kind;
  if(sk==='jelly'){x.scale(k,k);drawJelly(f)}
  else if(sk==='seahorse'){x.scale(k*f.face,k);drawSeahorse(f)}
  else{x.scale(k*f.face,k);x.rotate(clamp(f.vy/(Math.abs(f.vx)+.5),-.6,.6)*.5);
    if(sk==='turtle')drawTurtle(f);else if(sk==='ray')drawRay(f);else if(sk==='eel')drawEel(f);else drawFishBody(f)}
  x.restore();}

function spawnCrab(){const dir=chance(.5)?1:-1;return {x:dir>0?-40*S:W+40*S,dir,ph:R(0,6),col:pick(['#c0392b','#d35400','#e67e22','#a04030']),size:R(.7,1.2),pause:0,hermit:chance(.35)}}
function drawCrab(cr){const yy=sandAt(cr.x)+2*S,k=S*cr.size;x.save();x.translate(cr.x,yy);x.scale(k,k);const t=cr.ph;
  if(cr.hermit){const g=x.createRadialGradient(-6,-20,2,0,-12,22);g.addColorStop(0,'#f4e0c0');g.addColorStop(1,'#a07850');x.fillStyle=g;x.beginPath();x.moveTo(-18,-4);x.bezierCurveTo(-22,-30,14,-34,16,-8);x.closePath();x.fill();
    x.strokeStyle='rgba(90,60,30,.6)';x.lineWidth=1.5;x.beginPath();x.arc(-2,-14,9,0,5);x.stroke()}
  x.strokeStyle=cr.col;x.lineWidth=2.4;for(let i=0;i<3;i++)for(const s of [-1,1]){const a=Math.sin(t*6+i+(s>0?1:0))*.3;x.beginPath();x.moveTo(s*8,-6);x.lineTo(s*(16+i*3),-12+a*6);x.lineTo(s*(20+i*4),0);x.stroke()}
  if(!cr.hermit){x.fillStyle=cr.col;x.beginPath();x.ellipse(0,-9,14,9,0,0,7);x.fill()}
  x.fillStyle=cr.col;for(const s of [-1,1]){x.beginPath();x.ellipse(s*16,-18+Math.sin(t*2+s)*2,6,4,s*.5,0,7);x.fill()}
  x.strokeStyle='#222';x.lineWidth=1.2;for(const s of [-1,1]){x.beginPath();x.moveTo(s*4,-14);x.lineTo(s*5,-22);x.stroke();x.fillStyle='#111';x.beginPath();x.arc(s*5,-23,1.8,0,7);x.fill()}
  x.restore()}

// ================= POPULATION =================
function populate(instant){const pool=poolFor(env),want=+$('count').value;
  fish=fish.filter(f=>f.event);
  let n=0;while(n<want){const name=pickWeighted(pool);const sp=SP[name];
    if(sp.school){const k=RI(5,10),dir=chance(.5)?1:-1,y=R(.2,.7)*H,x0=instant?R(0,W):null,z=R(.6,1.05);
      for(let i=0;i<k;i++)fish.push(spawn(name,{dir,y:y+R(-40,40)*S,x:x0!==null?x0+R(-60,60)*S:undefined,z:z+R(-.05,.05)}));n+=k*.5}
    else{fish.push(spawn(name,instant?{x:R(0,W)}:{}));n++}}
  crabs=[];if(!env.glow&&env.hab!=='cold')for(let i=0;i<RI(1,3);i++){const cr=spawnCrab();cr.x=R(0,W);crabs.push(cr)}}
function pickWeighted(pool){const small=pool.filter(n=>!SP[n].big);return chance(.08)&&pool.some(n=>SP[n].big)?pick(pool.filter(n=>SP[n].big)):pick(small.length?small:pool)}
function turnover(){const pool=poolFor(env),active=fish.filter(f=>!f.leaving&&!f.event);if(!active.length)return;
  const out=pick(active);active.filter(f=>f.name===out.name).forEach(f=>{f.leaving=true;f.tx=f.x<W/2?-400*S:W+400*S;f.ty=f.y});
  const name=pickWeighted(pool),sp=SP[name];
  if(sp.school){const k=RI(5,10),dir=chance(.5)?1:-1,y=R(.2,.7)*H;for(let i=0;i<k;i++)fish.push(spawn(name,{dir,y:y+R(-40,40)*S}))}else fish.push(spawn(name))}

// ================= EVENTS =================
function toast(t){if(!$('names').checked)return;const el=$('toast');el.textContent=t;el.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.opacity=0,3500)}
function event(){const opts=[];const pool=poolFor(env);
  if(pool.includes('Sardine'))opts.push('sardines');
  if(pool.some(n=>SP[n].big))opts.push('giant');
  opts.push('closeup','closeup');
  if(pool.some(n=>SP[n].kind==='jelly'))opts.push('jellies');
  if(env.hab!=='pond'&&env.hab!=='koi'&&env.hab!=='amazon')opts.push('whale');
  opts.push('bubbles');
  const e=pick(opts);
  if(e==='sardines'){toast('🐟 A sardine storm!');const dir=chance(.5)?1:-1,y=R(.3,.6)*H;for(let i=0;i<60;i++)fish.push(spawn('Sardine',{dir,y:y+R(-80,80)*S,x:(dir>0?-R(50,400):W/S+R(50,400))*S,z:R(.7,1),event:'swarm'}));swarm={cx:W/2,cy:y,t:0,dur:30}}
  if(e==='giant'){const big=pick(pool.filter(n=>SP[n].big));toast(`A ${big} passes by…`);fish.push(spawn(big,{z:R(.9,1.3),y:R(.3,.6)*H,event:'pass'}))}
  if(e==='closeup'){const name=pick(pool.filter(n=>!SP[n].big&&SP[n].kind!=='jelly'));toast(`👀 ${name} comes to say hi`);fish.push(spawn(name,{z:R(2.4,3.4),y:R(.3,.6)*H,event:'close'}))}
  if(e==='jellies'){const j=pick(pool.filter(n=>SP[n].kind==='jelly'));toast(`A bloom of ${j}s`);for(let i=0;i<12;i++)fish.push(spawn(j,{x:R(0,W),y:H+R(50,500)*S,z:R(.5,1.1),event:'bloom'}))}
  if(e==='whale'){toast('🐋 Something huge in the distance…');whale={x:-W*.6,y:R(.2,.35)*H,dir:1,t:0}}
  if(e==='bubbles'){toast('🫧 Bubble curtain!');for(let i=0;i<180;i++)bubbles.push({x:R(0,W),y:H+R(0,H*.6),r:R(2,9)*S,v:R(1.5,3)})}
}
let swarm=null,whale=null;
function drawWhale(){if(!whale)return;whale.t+=1/60*speed;whale.x+=.8*S*speed;const k=H*.004*S/S;x.save();x.globalAlpha=.22;x.fillStyle=shade(env.w[2],-.3);x.translate(whale.x,whale.y+Math.sin(whale.t*.5)*10*S);x.scale(k*40,k*40);
  x.beginPath();x.moveTo(12,0);x.bezierCurveTo(10,-3,-2,-3.4,-8,-1.2);x.lineTo(-12,-2.6+Math.sin(whale.t)*.6);x.lineTo(-11.5,0);x.lineTo(-12,2.6+Math.sin(whale.t)*.6);x.lineTo(-8,1.2);x.bezierCurveTo(-2,3,10,3,12,0);x.fill();
  x.beginPath();x.ellipse(3,2.2,3,.7,.5,0,7);x.fill();x.restore();if(whale.x>W*1.6)whale=null}

let pressT=null,pressPos=null;
c.addEventListener('pointerdown',e=>{wake();const px=e.clientX*DPR,py=e.clientY*DPR;pressPos=[px,py];clearTimeout(pressT);pressT=setTimeout(()=>{feed(px);pressT=null},450);paw(px,py)});
c.addEventListener('pointerup',()=>{clearTimeout(pressT)});
function paw(px,py){stats.taps++;ripples.push({x:px,y:py,r:0});
  let caught=null;for(const f of fish){const d=Math.hypot(f.x-px,f.y-py);const reach=f.size*.45+20*S;
    if(d<reach&&!caught&&f.sp.kind!=='jelly')caught=f;
    if(d<260*S){const a=Math.atan2(f.y-py,f.x-px),p=(1-d/(260*S))*(f.sp.kind==='jelly'?1:6)*S;f.vx+=Math.cos(a)*p;f.vy+=Math.sin(a)*p;f.scared=2.5;if(f.sp.puffer)f.puffT=4;}}
  if(caught){stats.catches++;toast(`🐾 Caught a ${caught.name}! (${stats.catches})`);for(let i=0;i<24;i++)sparks.push({x:caught.x,y:caught.y,vx:R(-4,4)*S,vy:R(-4,4)*S,l:1,c:pick(['#fff','#ffe680','#8ef'])})}
  saveStats();updateStats()}
function feed(px){for(let i=0;i<14;i++)food.push({x:px+R(-50,50)*S,y:R(-10,20)*S,vy:R(.4,.9),w:R(0,6)})}

// ================= SOUND =================
let actx=null,soundNodes=null;
function startSound(){if(soundNodes)return;actx=actx||new (window.AudioContext||window.webkitAudioContext)();const len=actx.sampleRate*2,buf=actx.createBuffer(1,len,actx.sampleRate),d=buf.getChannelData(0);let last=0;
  for(let i=0;i<len;i++){last=(last+.02*(Math.random()*2-1))/1.02;d[i]=last*3.5}const src=actx.createBufferSource();src.buffer=buf;src.loop=true;
  const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=500;const g=actx.createGain();g.gain.value=.25;src.connect(lp).connect(g).connect(actx.destination);src.start();soundNodes={src,g}}
function stopSound(){if(soundNodes){soundNodes.src.stop();soundNodes=null}}
function bloop(){if(!soundNodes)return;const o=actx.createOscillator(),g=actx.createGain();o.frequency.setValueAtTime(R(300,700),actx.currentTime);o.frequency.exponentialRampToValueAtTime(R(900,1600),actx.currentTime+.08);
  g.gain.setValueAtTime(.05,actx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.12);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.15)}

// ================= WAKE LOCK =================
let wakeLock=null;async function wake(){try{if(!wakeLock&&navigator.wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>wakeLock=null)}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});

// ================= SCENES =================
function setScene(key){envKey=key;env=ENVS[key];env.seed=R(0,100);buildBG();buildPlants();populate(true);particles=[];bubbles=[];food=[];swarm=null;whale=null;
  sceneTimer=+$('dur').value*R(.85,1.15);toast(env.name);updateStats()}
function nextScene(){const keys=ENV_KEYS.filter(k=>k!==envKey);trans={t:0,to:pick(keys),done:false}}

// ================= UPDATE / DRAW =================
function updateFish(f,dt){const sp=f.sp;f.tt-=dt;f.scared=Math.max(0,f.scared-dt);
  if(sp.puffer){f.puffT=Math.max(0,(f.puffT||0)-dt);f.puff=lerp(f.puff,f.puffT>0?1:0,dt*3)}
  let tx=f.tx,ty=f.ty,maxS=sp.spd*2.2*S*(f.z<1?(.6+f.z*.4):1)*(f.event==='close'?.5:1);
  if(swarm&&f.event==='swarm'){const a=time*1.3+f.ph;tx=swarm.cx+Math.cos(a)*180*S;ty=swarm.cy+Math.sin(a*1.4)*90*S;maxS*=1.3}
  if(!f.leaving&&!f.event&&sp.kind!=='jelly'){let best=null,bd=350*S;for(const p of food){const d=Math.hypot(p.x-f.x,p.y-f.y);if(d<bd){bd=d;best=p}}
    if(best){tx=best.x;ty=best.y;maxS*=1.8;if(bd<f.size*.4){food.splice(food.indexOf(best),1);bloop()}}}
  if(f.scared>0)maxS*=3;
  if(sp.kind==='jelly'){f.ph+=dt*1.2;const pulse=Math.max(0,Math.sin(f.ph*1.3));f.vy=lerp(f.vy,-pulse*.9*S,dt*3)+.12*S*dt*60*.05;f.vx=lerp(f.vx,Math.sin(time*.1+f.ph)*.3*S,dt);f.x+=f.vx*dt*60;f.y+=f.vy*dt*60;
    if(f.y<-150*S){if(f.event)f.dead=1;else{f.y=H+100*S;f.x=R(0,W)}}return}
  const dx=tx-f.x,dy=ty-f.y,d=Math.hypot(dx,dy)||1;
  let ax=dx/d*maxS-f.vx,ay=dy/d*maxS*.6-f.vy;const turn=f.scared>0?4:1.2;f.vx+=ax*dt*turn;f.vy+=ay*dt*turn;
  if(sp.school&&!f.event){let cx=0,cy=0,n=0;for(const o of fish){if(o===f||o.name!==f.name)continue;const dd=Math.hypot(o.x-f.x,o.y-f.y);if(dd<150*S){cx+=o.vx;cy+=o.vy;n++;if(dd<18*S*f.z){f.vx-=(o.x-f.x)/dd*.2*S;f.vy-=(o.y-f.y)/dd*.2*S}}}
    if(n){f.vx=lerp(f.vx,cx/n,dt*.8);f.vy=lerp(f.vy,cy/n,dt*.8)}}
  if(sp.kind==='seahorse'){f.vy=Math.sin(time*.8+f.ph)*.3*S}
  f.x+=f.vx*dt*60;f.y+=f.vy*dt*60;
  const top=H*(env.ice?.2:.07),bot=sp.bottom?sandY()-4*S:sandY()-f.size*.2;f.y=clamp(f.y,top,bot);
  if(Math.abs(f.vx)>.15*S){f.face=lerp(f.face,Math.sign(f.vx),dt*5)}
  const spd=Math.hypot(f.vx,f.vy)/S;f.ph+=dt*(2+spd*2.2)*(sp.kind==='turtle'||sp.kind==='ray'?.5:1);
  if(!f.leaving&&!f.event&&(f.tt<0||d<30*S))newTarget(f);
  if(chance(.0015)&&!f.event&&!sp.big)f.vx*=-1;
  if(f.event==='pass'||f.event==='close'){if(!f.passDir){f.passDir=Math.sign(f.vx)||1;f.tx=f.passDir>0?W+600*S:-600*S;f.ty=f.y}f.tx=f.passDir>0?W+600*S:-600*S}
  if(f.event==='swarm'&&swarm&&swarm.t>swarm.dur){f.event='leave';f.leaving=true;f.tx=f.x<W/2?-300*S:W+300*S}
  if((f.leaving||f.event)&&(f.x<-500*S||f.x>W+500*S))f.dead=1;
  f.size=f.sp.len*S*f.z*f.scaleV;}

let last=performance.now(),turnT=R(15,30),todDark=0;
function frame(now){const rdt=Math.min((now-last)/1000,.05);last=now;const dt=rdt*speed;time+=dt;
  // scene timing
  if($('env').value==='auto'&&!trans){sceneTimer-=rdt;if(sceneTimer<=0)nextScene()}
  if($('events').checked){eventTimer-=rdt;if(eventTimer<=0){event();eventTimer=R(60,150)}}
  turnT-=rdt;if(turnT<=0){turnover();turnT=R(15,35)}
  if(swarm){swarm.t+=dt;swarm.cx+=Math.sin(swarm.t*.3)*2*S;swarm.cy=clamp(swarm.cy+Math.cos(swarm.t*.4)*1.5*S,H*.2,H*.7);if(swarm.t>swarm.dur+15)swarm=null}
  // population count adjust
  const active=fish.filter(f=>!f.leaving&&!f.event).length,want=+$('count').value;if(active<want*.7&&chance(.02))fish.push(spawn(pickWeighted(poolFor(env))));
  // --- draw background
  x.drawImage(bg,0,0);
  // god rays
  if(env.rays){x.save();x.globalCompositeOperation='lighter';for(let i=0;i<8;i++){const cx=(i/8)*W+Math.sin(time*.15+i*1.9)*W*.06,w=W*(.03+.02*Math.sin(time*.3+i));
    const rg=x.createLinearGradient(0,0,0,H*.9);rg.addColorStop(0,`rgba(255,250,220,${(.07+.04*Math.sin(time*.5+i*2))*env.rays*(1-todDark)})`);rg.addColorStop(1,'rgba(255,250,220,0)');
    x.fillStyle=rg;x.beginPath();x.moveTo(cx,0);x.lineTo(cx+w,0);x.lineTo(cx+w*2.5+W*.12,H*.9);x.lineTo(cx+W*.08,H*.9);x.fill()}x.restore()}
  drawWhale();
  // back plants
  for(const p of plants)if(!p.front)drawPlant(p);
  // caustics on sand
  if(env.rays){x.save();x.globalCompositeOperation='lighter';x.strokeStyle=`rgba(255,255,230,${.12*env.rays*(1-todDark)})`;x.lineWidth=2*S;const sy=sandY();
    for(let i=0;i<50;i++){const cx=((i*97.31)%1)*W+Math.sin(time*.9+i)*20*S,cy=sy+((i*.6180339)%1)*(H-sy);x.beginPath();x.ellipse(cx,cy,(24+10*Math.sin(time*1.2+i))*S,6*S,Math.sin(i),0,7);x.stroke()}x.restore()}
  // vents
  for(const v of vents){const vy=sandAt(v.x);const vg=x.createRadialGradient(v.x,vy,0,v.x,vy,80*S);vg.addColorStop(0,'rgba(255,90,20,.5)');vg.addColorStop(1,'rgba(255,60,0,0)');x.fillStyle=vg;x.fillRect(v.x-80*S,vy-80*S,160*S,160*S);
    x.fillStyle='#2a1a18';x.beginPath();x.moveTo(v.x-30*S,vy+5*S);x.lineTo(v.x-8*S,vy-60*S);x.lineTo(v.x+8*S,vy-60*S);x.lineTo(v.x+30*S,vy+5*S);x.fill();if(chance(.5))bubbles.push({x:v.x+R(-6,6)*S,y:vy-60*S,r:R(2,6)*S,v:R(1,2.5),smoke:true})}
  // crabs
  for(const cr of crabs){if(cr.pause>0)cr.pause-=dt;else{cr.x+=cr.dir*.5*S*speed;cr.ph+=dt;if(chance(.004))cr.pause=R(1,4)}if(cr.x<-60*S||cr.x>W+60*S){cr.dir*=-1}drawCrab(cr)}
  // fish sorted by depth, with haze layer between far and near
  for(const f of fish)updateFish(f,dt);fish=fish.filter(f=>!f.dead);
  fish.sort((a,b)=>a.z-b.z);let hazed=false;
  for(const f of fish){if(!hazed&&f.z>.8){hazed=true;x.fillStyle=hexA(env.w[1],.18);x.fillRect(0,0,W,H)}drawCreature(f)}
  if(!hazed){x.fillStyle=hexA(env.w[1],.18);x.fillRect(0,0,W,H)}
  // food
  x.fillStyle='#b07030';for(const p of food){if(p.y<sandAt(p.x)-3*S){p.y+=p.vy*S*speed;p.x+=Math.sin(time*2+p.w)*.3*S}x.beginPath();x.arc(p.x,p.y,3*S,0,7);x.fill()}if(food.length>150)food.shift();
  // bubbles
  if(chance(.1))bubbles.push({x:R(0,W),y:H,r:R(2,6)*S,v:R(1,2)});
  x.lineWidth=1.3*S;bubbles=bubbles.filter(b=>{b.y-=b.v*S*speed;b.x+=Math.sin(b.y*.02)*.5*S;
    if(b.smoke){x.fillStyle=`rgba(40,30,30,${.25*(b.y/H)})`;x.beginPath();x.arc(b.x,b.y,b.r*3,0,7);x.fill()}
    else{x.strokeStyle='rgba(255,255,255,.55)';x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.stroke();x.fillStyle='rgba(255,255,255,.6)';x.beginPath();x.arc(b.x-b.r*.35,b.y-b.r*.35,b.r*.3,0,7);x.fill()}
    return b.y>(env.ice?H*.12:0)-10});
  if(bubbles.length>400)bubbles.splice(0,bubbles.length-400);
  // particles: marine snow / plankton / motes
  if(particles.length<(env.snow||env.plankton?160:90))particles.push({x:R(0,W),y:R(0,H),r:R(.6,2)*S,v:R(.1,.4),ph:R(0,6)});
  for(const p of particles){p.y+=(env.snow?p.v:-p.v*.4)*S*speed;p.x+=Math.sin(time*.4+p.ph)*.2*S;if(p.y>H)p.y=0;if(p.y<0)p.y=H;
    if(env.plankton){const a=.5+.5*Math.sin(time*2+p.ph);x.fillStyle=`rgba(120,240,255,${a*.8})`;x.beginPath();x.arc(p.x,p.y,p.r*1.3,0,7);x.fill()}else{x.fillStyle='rgba(255,255,255,.35)';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}}
  // front plants
  for(const p of plants)if(p.front){x.save();x.globalAlpha=.9;drawPlant(p);x.restore()}
  // lily pads & surface
  if(env.lily){x.save();for(let i=0;i<env.lily;i++){const lx=((i*.37+env.seed)%1)*W+Math.sin(time*.2+i)*10*S,ly=H*.035+Math.sin(time*.5+i)*2*S;x.fillStyle='rgba(20,60,20,.55)';
    x.beginPath();x.ellipse(lx,ly,70*S,14*S,0,.25,Math.PI*2);x.lineTo(lx,ly);x.fill();x.strokeStyle='rgba(30,90,30,.8)';x.lineWidth=1.5*S;x.beginPath();x.moveTo(lx,ly+14*S);x.quadraticCurveTo(lx+Math.sin(time+i)*8*S,H*.2,lx+Math.sin(time*.6+i)*14*S,sandY());x.stroke()}x.restore()}
  if(!env.ice){const sg=x.createLinearGradient(0,0,0,H*.06);sg.addColorStop(0,`rgba(255,255,255,${.25*(1-todDark)})`);sg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=sg;x.fillRect(0,0,W,H*.06);
    x.strokeStyle=`rgba(255,255,255,${.2*(1-todDark)})`;x.lineWidth=2*S;x.beginPath();for(let xx=0;xx<=W;xx+=20*S)x.lineTo(xx,H*.012+Math.sin(xx*.01/S+time*1.5)*3*S+Math.sin(xx*.023/S-time)*2*S);x.stroke()}
  // ripples & sparks
  ripples=ripples.filter(r=>{r.r+=8*S;const a=1-r.r/(160*S);x.strokeStyle=`rgba(255,255,255,${a*.6})`;x.lineWidth=3*S;x.beginPath();x.arc(r.x,r.y,r.r,0,7);x.stroke();return a>0});
  sparks=sparks.filter(s=>{s.x+=s.vx;s.y+=s.vy;s.l-=.02;x.fillStyle=s.c;x.globalAlpha=Math.max(0,s.l);x.beginPath();x.arc(s.x,s.y,3*S,0,7);x.fill();x.globalAlpha=1;return s.l>0});
  // time of day
  if($('tod').checked){const hr=new Date().getHours()+new Date().getMinutes()/60;const target=hr>=7&&hr<18?0:hr>=18&&hr<21?(hr-18)/3*.55:hr>=5&&hr<7?(7-hr)/2*.55:.55;todDark=lerp(todDark,target,.01)}else todDark=lerp(todDark,0,.05);
  if(todDark>.01){x.fillStyle=`rgba(0,5,25,${todDark})`;x.fillRect(0,0,W,H)}
  // vignette
  const vg=x.createRadialGradient(W/2,H/2,Math.min(W,H)*.4,W/2,H/2,Math.max(W,H)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');x.fillStyle=vg;x.fillRect(0,0,W,H);
  // scene transition: murk in, swap, murk out
  if(trans){trans.t+=rdt;const a=trans.t<3?trans.t/3:Math.max(0,1-(trans.t-3.3)/3);if(trans.t>=3&&!trans.done){trans.done=true;setScene(trans.to)}
    x.fillStyle=hexA(env.w[1],a);x.fillRect(0,0,W,H);if(trans.t>6.5)trans=null}
  requestAnimationFrame(frame);}

// ================= UI =================
function updateStats(){const seen=Object.keys(stats.seen).length;$('stats').innerHTML=`Scene: <b>${env.name}</b><br>🐾 Paw taps: <b>${stats.taps}</b> · Catches: <b>${stats.catches}</b><br>📖 Fishdex: <b>${seen}</b> / ${NAMES.length} species seen`}
ENV_KEYS.forEach(k=>$('env').add(new Option(ENVS[k].name,k)));
$('env').onchange=()=>{const v=$('env').value;if(v!=='auto')trans={t:0,to:v,done:false}};
$('dur').onchange=()=>sceneTimer=+$('dur').value;
$('count').onchange=()=>populate(false);
$('speed').oninput=e=>speed=+e.target.value;
$('next').onclick=()=>{if(!trans)nextScene()};
$('event').onclick=event;
$('food').onclick=()=>feed(R(.2,.8)*W);
$('fs').onclick=()=>{document.documentElement.requestFullscreen?.();wake()};
$('sound').onchange=e=>e.target.checked?startSound():stopSound();
const toggleMenu=()=>{$('ui').classList.toggle('hide');updateStats()};
$('menuBtn').onclick=toggleMenu;
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='m'||k==='h')toggleMenu();if(k==='n'&&!trans)nextScene();if(k==='e')event()});
resize();setScene(pick(ENV_KEYS));toast('Tap the ☰ corner or press M for the menu');requestAnimationFrame(frame);
</script>
</body>
